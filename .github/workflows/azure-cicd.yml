name: Azure CD - Build and Deploy to AKS

on:
  workflow_run:
    workflows:
      - Java CI with Maven
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: petclinic-azure-deployment
  cancel-in-progress: false

env:
  ACR_NAME: acrpetclinickydj7o
  ACR_LOGIN_SERVER: acrpetclinickydj7o.azurecr.io
  RESOURCE_GROUP: rg-petclinic-dev
  AKS_CLUSTER: aks-petclinic-dev
  K8S_NAMESPACE: petclinic
  DEPLOYMENT_NAME: petclinic
  CONTAINER_NAME: petclinic

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: |
          az account show \
            --query "{Subscription:name,Id:id,Tenant:tenantId}" \
            -o table

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Define image
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          IMAGE="$ACR_LOGIN_SERVER/petclinic:$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Building image: $IMAGE"

      - name: Build and push multi-architecture image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            -t "$IMAGE" \
            --push \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Set AKS context
        uses: azure/aks-set-context@v5.0.1
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: 'false'

      - name: Verify Kubernetes access
        run: |
          kubectl get nodes
          kubectl get deployment "$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE"

      - name: Deploy new image
        run: |
          kubectl set image \
            deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME"="$IMAGE" \
            -n "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/"$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE"

          kubectl get pods \
            -n "$K8S_NAMESPACE" \
            -l app=petclinic \
            -o wide

      - name: Show deployed image
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo